{% extends "base.html" %}
{% block title %}Login — VIBE MAP{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-title" style="background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
      VIBE MAP
    </div>
    <p class="auth-subtitle">Welcome back 🔥</p>

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="your_username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary btn-full">LOGIN 🔥</button>
    </form>

    <p class="auth-link">
      Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
