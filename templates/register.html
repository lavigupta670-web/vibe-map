{% extends "base.html" %}
{% block title %}Register — VIBE MAP{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-title" style="background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;">
      VIBE MAP
    </div>
    <p class="auth-subtitle">Join the vibe 🔥</p>

    <form method="POST" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group" style="text-align:center;">
        <label class="form-label">Profile Photo (optional)</label>
        <div class="profile-upload" style="display:inline-block;">
          <img id="profilePreview" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a1a' width='100' height='100'/><text x='50' y='60' text-anchor='middle' fill='%23555' font-size='36'>👤</text></svg>"
               alt="Profile" style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--border);">
          <input type="file" name="profile_photo" accept="image/jpeg,image/png,image/webp"
                 onchange="document.getElementById('profilePreview').src=URL.createObjectURL(this.files[0])">
          <div class="profile-upload-overlay">📷</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-input" placeholder="cool_vibes" required autocomplete="username" minlength="3">
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-input" placeholder="you@email.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="confirm_password" class="form-input" placeholder="Repeat password" required minlength="6" autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary btn-full">CREATE ACCOUNT 🔥</button>
    </form>

    <p class="auth-link">
      Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
